# CI: the same gate developers run (make verify), plus the SBOM artifact. Actions are pinned to commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRM_SQL_SERVER: localhost
      CRM_SQL_USER: sa
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Enable pnpm (packageManager in src/web/package.json)
        run: corepack enable

      - name: Install actionlint (pinned, checksum-verified)
        run: |
          scripts/tools/install-actionlint.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # SQL Server for integration tests. The SA password is generated per run and masked, so no
      # password is stored in the repository or in secrets.
      - name: Start SQL Server
        run: |
          password="Ci-$(openssl rand -hex 16)-1a!"
          echo "::add-mask::$password"
          echo "CRM_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          for _ in $(seq 1 60); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$password" -Q "SELECT 1" -b >/dev/null 2>&1; then
              echo "SQL Server ready"; exit 0
            fi
            sleep 2
          done
          docker logs sql; exit 1

      - name: Restore
        run: make setup

      - name: Verify (lint, build, tests, api-client drift, audit, SPA checks)
        run: make verify

      - name: SBOM (CycloneDX, validated)
        run: make check-sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom/
          if-no-files-found: error
