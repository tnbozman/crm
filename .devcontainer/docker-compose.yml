# Development-only SQL Server password, defined once: the db service uses it as the SA password and the app
# container receives it as CRM_SQL_PASSWORD (make doctor, post-create, Crm.Platform.Testing.SqlFixture).
# Never used outside the devcontainer; Azure uses managed identity (CLAUDE.md security rules).
x-dev-sql-password: &dev-sql-password "Dev_Only_Passw0rd!"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/crm:cached
    command: sleep infinity
    environment:
      CRM_SQL_USER: sa
      CRM_SQL_PASSWORD: *dev-sql-password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *dev-sql-password
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqldata:
